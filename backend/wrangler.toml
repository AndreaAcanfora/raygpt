# Cloudflare Workers deployment (alternative to running src/server.ts with Node).
# Secrets are not stored here: set them with `npx wrangler secret put <NAME>`.
name = "raygpt-backend"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Public URL: https://raygpt-backend.andreaacanfora.workers.dev
workers_dev = true
# No per-version preview URLs: only the deployed version is reachable.
preview_urls = false

# The web test client (public/) is served as static assets; other paths reach the Worker.
[assets]
directory = "./public"

[vars]
OPENAI_MODEL = "gpt-live-1"
OPENAI_VOICE = "marin"
MAX_SESSIONS_PER_DAY = "50"
# Web search during the conversation (empty = off), e.g. "gpt-5.6-terra".
OPENAI_WEB_SEARCH_MODEL = "gpt-5.6-terra"
# The user's VPS as an MCP tool (cb-gateway), run by the same backend model.
# Its token is the VPS_MCP_TOKEN secret, uploaded by the deploy workflow.
VPS_MCP_URL = "https://claude-vps.tail495c87.ts.net:10000/mcp"
# Apple Team ID (10 characters) for the universal link https://<backend>/meta/callback.
APPLE_TEAM_ID = "PVX9XK893V"
# Strada C only: comma-separated E.164 numbers allowed to call.
SIP_CALLER_ALLOWLIST = ""

[observability]
enabled = true
