<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>RayGPT — test GPT-Live</title>
  <style>
    :root { color-scheme: light dark; --accent: #2f6fdf; --muted: #888; --line: #8884; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-left)) 48px; }
    h1 { font-size: 1.3rem; margin: 0 0 4px; }
    p.hint { color: var(--muted); margin: 0 0 16px; font-size: 0.9rem; }
    fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 0 0 12px; }
    legend { color: var(--muted); font-size: 0.85rem; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin: 8px 0 4px; }
    input, select { width: 100%; font-size: 16px; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: inherit; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    button { font-size: 1.05rem; padding: 14px; border-radius: 10px; border: 0; width: 100%; color: #fff; background: var(--accent); }
    button.secondary { background: #666; }
    button.danger { background: #c4372d; }
    button:disabled { opacity: 0.4; }
    #status { font-weight: 600; margin: 12px 0 4px; }
    #stats { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
    #transcript { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
    #transcript p { margin: 6px 0; }
    #transcript .user::before { content: "Tu: "; font-weight: 600; }
    #transcript .assistant::before { content: "RayGPT: "; font-weight: 600; color: var(--accent); }
    details { margin-top: 12px; color: var(--muted); font-size: 0.8rem; }
    .events-bar { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
    .events-bar button { width: auto; font-size: 0.9rem; padding: 8px 14px; }
    #events { white-space: pre-wrap; font-family: ui-monospace, monospace; max-height: 240px; overflow: auto; }
  </style>
</head>
<body>
<main>
  <h1>RayGPT — test GPT-Live</h1>
  <p class="hint">Collega gli occhiali all’iPhone, premi Avvia e parla. L’audio passa dal microfono e dagli altoparlanti attivi (gli occhiali, se collegati).</p>

  <fieldset>
    <legend>Impostazioni</legend>
    <label for="token">Token del backend (APP_TOKEN)</label>
    <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="row">
      <div>
        <label for="voice">Voce</label>
        <select id="voice"></select>
      </div>
      <div>
        <label for="idle">Chiudi dopo silenzio (s)</label>
        <input id="idle" type="number" min="15" max="900" value="120">
      </div>
      <div>
        <label for="maxMinutes">Durata massima (min)</label>
        <input id="maxMinutes" type="number" min="1" max="120" value="20">
      </div>
    </div>
    <label for="mic">Microfono</label>
    <div class="row">
      <select id="mic"><option value="">Predefinito di sistema</option></select>
      <button id="refreshMics" class="secondary" type="button" style="flex: 0 0 auto; width: auto; padding: 8px 12px;">Aggiorna</button>
    </div>
  </fieldset>

  <div class="row">
    <button id="start">Avvia</button>
    <button id="mute" class="secondary" disabled>Silenzia microfono</button>
    <button id="stop" class="danger" disabled>Chiudi</button>
  </div>

  <div id="status">Pronto</div>
  <div id="stats"></div>
  <div id="transcript"></div>

  <details>
    <summary>Eventi (debug)</summary>
    <div class="events-bar">
      <button id="copyEvents" class="secondary" type="button">Copia eventi</button>
      <span id="copyStatus" role="status"></span>
    </div>
    <div id="events"></div>
  </details>

  <audio id="remote" autoplay playsinline></audio>
</main>
<script src="/client.js"></script>
</body>
</html>
